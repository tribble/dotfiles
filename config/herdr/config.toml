onboarding = false
[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
mouse_capture = true
show_agent_labels_on_pane_borders = true

status_indicators = "dots"
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
# focused agent row: catppuccin surface1 instead of the near-invisible default (#1e1e2e on #181825)
active_row_bg = "#45475a"

[ui.sidebar.agents]
# One row per agent: the space header already names the workspace; tab = agent name (slug) since bf43ef1;
# the terminal title is "π - <agent> - <dir>", all redundant. Before: 3 rows repeating the name up to 5×.
row_gap = 1
rows = [
  ["state_icon", "agent", { token = "state_text", rules = [
    { contains = "block", ignore_case = true, fg = "#fb4934", bold = true },
    { contains = "question", ignore_case = true, fg = "#fb4934", bold = true },
    { contains = "approv", ignore_case = true, fg = "#fb4934", bold = true },
    { contains = "work", ignore_case = true, fg = "#fabd2f" },
    { contains = "idle", ignore_case = true, dim = true },
    { contains = "done", ignore_case = true, dim = true },
  ] }],
  [{ token = "$artifacts", dim = true }],
]

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "tribble.artifacts.show"
description = "artifacts of the focused agent"

